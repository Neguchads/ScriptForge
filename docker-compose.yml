# Só o app. O banco é externo (TiDB Cloud, veja docs/DATABASE_SETUP.md) e
# as variáveis vêm do arquivo .env (veja ENV_EXAMPLE.md). O .env NÃO entra na imagem.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
